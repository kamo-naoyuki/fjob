name: Deploy web demo

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_site.outputs.pages_enabled }}
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate static web demo
        run: |
          GO_BINARY="$(command -v go)" scripts/generate-static-web.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install terminal demo tools
        run: |
          python -m pip install asciinema
          cargo install --locked --git https://github.com/asciinema/agg

      - name: Generate terminal demos
        run: |
          scripts/generate-demos.sh
          cp docs/demo-shell.gif docs/demo-rotari.gif docs/web-demo/

      - name: Check whether GitHub Pages is enabled
        id: pages_site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages-site.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          case "${status}" in
            200)
              echo "pages_enabled=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "pages_enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::notice title=GitHub Pages not enabled::Skipping Pages deployment because this repository does not have a GitHub Pages site configured."
              ;;
            *)
              cat /tmp/pages-site.json >&2
              exit 1
              ;;
          esac

      - name: Configure GitHub Pages
        if: steps.pages_site.outputs.pages_enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages_site.outputs.pages_enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/web-demo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
