default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: gofmt-check
        name: gofmt check
        entry: bash -c 'test -z "$(gofmt -l .)"'
        language: system
        pass_filenames: false

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        stages: [manual]

      - id: example-shellcheck
        name: bash syntax check
        entry: bash -n
        language: system
        files: ^example\.sh$
